<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
          display: flex;
          background-color: #1d4c72;
        }

        #circle{
          width: 200px;height: 200px;
          background-color: tomato;
          border-radius: 100%;
          border: 5px dashed black;
          display: flex;
          align-items: center;
          text-align: center;
        }

        #border{
          width: 250px;
          height: 70px;
          background-color: tomato;
          border: 2px dashed black;
          text-align: center;
          border-top-left-radius: 35%;
          border-bottom-right-radius: 35%;
          margin-top: 80px;
          margin-left: 50px;
        }

        #shadow{
          border: 2px solid black;
          background-color: tomato;
          margin: 360px 0 0 -255px;
          box-shadow: 4px 4px 4px black;
          margin-top: 300px;
          margin-left: -400px;
        }
    </style>
</head>
<body>
    <div id="circle">
    <p class="kalimat-circle">Yang ini border lingkaran. Pendekatan yang digunakan masih sama lho. Ayo kreasikan sendiri ya??</p>
  </div>

  <div id="border">
    <p>Bisa juga bikin kreasi border seperti ini. Mmm..</p>
  </div>

  <div id="shadow">
    <p>Kalau yang ini semacam efek shadow. Keran kan?</p>
  </div>
</body>
