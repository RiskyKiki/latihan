<html lang="en">
    <head>
        <title>Style Sheet</title>
        <style type="text/css">
            .border1{
                border: 2px solid red;
            }.border2{
                border: 2px dashed red;
            }.border3{
                border: 2px dotted red;
            }
        </style>
    </head>
    <body>
        <p class="border1">
            Ini paragraft. Ini paragraft. Ini paragraft. Ini paragraft. 
        </p>
        <p class="border2">
            Ini paragraft. Ini paragraft. Ini paragraft. Ini paragraft. 
        </p>
        <p class="border3">
            Ini paragraft. Ini paragraft. Ini paragraft. Ini paragraft. 
        </p>
    </body>
</html>
