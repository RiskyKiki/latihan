<HTML>
    <HEAD><TITLE>Percabangan IF-ELSE 2</TITLE></HEAD>
    <BODY>
        <SCRIPT language="JavaScript">
            function hitungtotal(){
            var nama = (document.fform.inama.value);
            var tujuan = (document.fform.itujuan.value);
            var kelas = (document.fform.ikelas.value);
            var jumlahtiket = parseFloat(document.fform.ijumlah.value);
            var ht = 0.0; sub = 0.0; diskon =0.0; total =0.0;
            if (tujuan=="Jakarta"){
                if(kelas=="Ekonomi")
                ht =100000;
                else if(kelas=="Eksekutif")
                ht =170000;
                else if(kelas=="Bisnis")
                ht =130000;}
            else if (tujuan=="Solo"){
                if(kelas=="Ekonomi")
                ht =150000;
                else if(kelas=="Eksekutif")
                ht =200000;
                else if(kelas=="Bisnis")
                ht =175000;}
            else if (tujuan=="Magetan"){
                if(kelas=="Ekonomi")
                ht =80000;
                else if(kelas=="Eksekutif")
                ht =120000;
                else if(kelas=="Bisnis")
                ht =100000;}
            else{
                if(kelas=="Ekonomi")
                ht =90000;
                else if(kelas=="Eksekutif")
                ht =140000;
                else if(kelas=="Bisnis")
                ht =110000;}    

            sub = jumlahtiket*ht;
            if (document.fform.imember.checked==true){
            diskon =0.10*sub;}
            else{
            diskon=0.0;}
            total = sub-diskon;
            document.fform.otiket.value=eval(ht);
            document.fform.osub.value=eval(sub);
            document.fform.odiskon.value=eval(diskon);
            document.fform.ototal.value=eval(total);
            }
        </SCRIPT>
        <FORM NAME ="fform">
            <table border="1" align="center"width="70%">
                <tr>
                    <td width="100%" colspan="2"><H2 ALIGN="center">Travel BintangAbadi</H2></td>
                </tr>
                <tr>
                <td width="50%"><PRE>
            Nama  :<input type="text" size="15" name="inama">
            Tujuan:<select name="itujuan" size=1>
                <option>Tujuan</option>
                <option value="Jakarta">Jakarta</option>
                <option value="Solo">Solo</option>
                <option value="Magetan">Magetan</option>
                <option value="Surabaya">Surabaya</option>
                </select>
            Kelas :<select name="ikelas" size=1>
                <option>Kelas</option>
                <option value="Eksekutif">Eksekutif</option>
                <option value="Bisnis">Bisnis</option>
                <option value="Ekonomi">Ekonomi</option>
                </select>
            Jumlah Tiket:<input type="text" size="3" name="ijumlah">
            Member :<input type="checkbox" name="imember">Ya</td></pre>
                <td width="50%"><pre>
            Harga Tiket:Rp.<input type="text" size="10" name="otiket">
            Sub Total  :Rp.<input type="text" size="10" name="osub">
            Diskon     :Rp.<input type="text" size="10" name="odiskon">
            Total Bayar:Rp.<input type="text" size="10" name="ototal"></td><pre>
                </tr>
                <tr>
                <td width="100%" colspan="2">
                <center>
                <INPUT TYPE="button" value="Hitung" onclick="hitungtotal()">
                <INPUT TYPE="reset" value="Ulang">
                </center></td>
                </tr>
            </table>
        </FORM>
    </BODY>
</HTML>
